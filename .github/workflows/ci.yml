name: PickyHack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Verification Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20.x, 22.x ]
        python-version: [ '3.10', '3.11' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 1. Install Dependencies
        run: npm ci || npm install

      - name: 2. Lint & Code Formatting Check
        run: npm run lint

      - name: 3. Syntax Verification (Node & Python Server)
        run: |
          npm run check
          python -m py_compile server.py src/backend/server.py

      - name: 4. Execute Enterprise Security & Unit Test Suite
        run: npm test

      - name: 5. Build & Distribution Verification
        run: npm run build

      - name: 6. Dependency Security Audit
        run: npm run audit

  ci-gate:
    name: PickyHack CI Gate
    runs-on: ubuntu-latest
    needs: [ test-and-verify ]
    if: always()
    steps:
      - name: Evaluate Verification Matrix Results
        run: |
          if [ "${{ needs.test-and-verify.result }}" != "success" ]; then
            echo "❌ CI Gate Failed: One or more matrix verification jobs did not succeed."
            exit 1
          fi
          echo "✅ CI Gate Passed: All dependency, lint, syntax, test, build, and security checks succeeded."
